name: MEDIA Bot

on:
  schedule:
    # Запуск каждые 15 минут
    - cron: '*/15 * * * *'
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  publish:
    runs-on: ubuntu-latest
    # ВАЖНО: Даем права на запись, чтобы сохранить историю (history.json)
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests google-generativeai google-api-core
          
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python poster.py
      
      # СОХРАНЯЕМ ИСТОРИЮ ОБРАТНО В РЕПОЗИТОРИЙ
      - name: Commit history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update news history [skip ci]"
          file_pattern: history.json