name: MEDIA Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <--- ВАЖНО: разрешаем запись в репозиторий
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests google-generativeai google-api-core
          
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python poster.py
      
      # ЭТОТ БЛОК СОХРАНЯЕТ ИСТОРИЮ ОБРАТНО В РЕПОЗИТОРИЙ
      - name: Commit history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update news history"
          file_pattern: history.json
